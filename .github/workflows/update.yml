name: Update league data

on:
  schedule:
    # 11:00 UTC daily = 7:00 AM ET during the season.
    # Cron here is always UTC — it does not follow daylight saving.
    - cron: "0 11 * * *"
    # Tuesday morning extra run, after Monday night games settle.
    - cron: "0 13 * * 2"
    # Sunday late morning, 15:00 UTC = 11:00 AM ET, an hour before the early
    # window. The overnight pull is twenty hours old by kickoff, which means
    # the lineup warnings can be telling somebody their kicker is questionable
    # when he was ruled out at nine. A stale warning is worse than none,
    # because people act on it.
    - cron: "0 15 * * 0"
    # And again just before the late window, for anyone still deciding.
    - cron: "0 19 * * 0"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write          # required so the job can commit data/league.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # v5 on both. v4 runs on the Node 20 action runtime, which GitHub is
      # retiring, and that deprecation notice at the top of every run is about
      # the actions themselves rather than anything in this repo. The
      # node-version below is separate and still 20, which is what the scripts
      # want. Bumping that is a one line change whenever you feel like it.
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Fetch league data from ESPN
        run: node scripts/fetch.js

      # Head-to-head history, every meeting since 2019. Allowed to fail on its
      # own so a bad ESPN response here can never stop league.json from landing.
      # The script leaves the existing file alone rather than writing an empty
      # one, and skips the write entirely when nothing has changed.
      - name: Build head-to-head history
        continue-on-error: true
        run: node scripts/h2h.mjs

      # Second opinion on every player, keyed onto ESPN ids. Allowed to fail on
      # its own: without it the app blends nothing and says "ESPN only".
      - name: Build blended projections
        continue-on-error: true
        run: node scripts/projections.mjs

      # Weekly packs and superlatives for the most recently completed week.
      # Publishes nothing until every game in a week is final, which lands it
      # on Tuesday morning. Also allowed to fail on its own.
      - name: Build weekly packs
        continue-on-error: true
        run: node scripts/weekly.mjs

      # Warning only, on purpose. A red test should be visible, but it must not
      # block the nightly data. Check the Actions tab if this step goes yellow.
      #
      # Every suite runs, every time. This was one bash script under `set -e`,
      # so the first suite to fail aborted the step and the eleven after it
      # never ran at all. That happened for the whole of the preseason without
      # anyone noticing, because the step is allowed to fail and the job still
      # shows a tick. Each suite is its own process, so a red one says nothing
      # about the next.
      #
      # The glob picks up new suites on its own rather than needing this list
      # kept in step with the folder.
      - name: Run tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          suites=(test/*.test.mjs)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::no test suites found in test/"
            exit 1
          fi
          red=()
          for t in "${suites[@]}"; do
            echo "::group::$t"
            node "$t"
            if [ $? -ne 0 ]; then red+=("$t"); fi
            echo "::endgroup::"
          done
          echo
          echo "${#suites[@]} suites run, ${#red[@]} red"
          if [ ${#red[@]} -ne 0 ]; then
            for t in "${red[@]}"; do echo "::warning file=$t::suite is failing"; done
            exit 1
          fi
          echo "all green"

      # Two runs have now ended with data/accuracy.json missing and no way to
      # tell whether the script never wrote it, wrote it and git ignored it, or
      # whether the repo is even running the version that writes it. This says
      # so out loud rather than leaving it to be guessed at again.
      - name: What is actually in data
        if: always()
        run: |
          echo "::group::files on disk"
          ls -la data || echo "no data directory"
          echo "::endgroup::"
          echo "::group::what git sees"
          git status --porcelain -- data || true
          git check-ignore -v data/accuracy.json || echo "accuracy.json is not ignored"
          echo "::endgroup::"
          echo "::group::which version of the script is checked out"
          grep -c "accuracy log" scripts/projections.mjs \
            || echo "MISSING: this projections.mjs has no accuracy block in it"
          grep -c "captureWeek" scripts/projections.mjs || true
          echo "::endgroup::"

      - name: Commit if anything changed
        run: |
          git config user.name "bromigos-bot"
          git config user.email "actions@github.com"
          # The whole directory, not a hand kept list. Naming the files one by
          # one means anything a script starts writing is generated on every
          # run and thrown away, with nothing in the log to say so. That is
          # exactly what happened to data/accuracy.json, which is the file the
          # projection scorecard is built from and the one thing that cannot be
          # recovered after a week has been played.
          git add -A data
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update league data $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
