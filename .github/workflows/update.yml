name: Update league data

on:
  schedule:
    # 11:00 UTC daily = 7:00 AM ET during the season.
    # Cron here is always UTC — it does not follow daylight saving.
    - cron: "0 11 * * *"
    # Tuesday morning extra run, after Monday night games settle.
    - cron: "0 13 * * 2"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write          # required so the job can commit data/league.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch league data from ESPN
        run: node scripts/fetch.js

      # Head-to-head history, every meeting since 2019. Allowed to fail on its
      # own so a bad ESPN response here can never stop league.json from landing.
      # The script leaves the existing file alone rather than writing an empty
      # one, and skips the write entirely when nothing has changed.
      - name: Build head-to-head history
        continue-on-error: true
        run: node scripts/h2h.mjs

      # Second opinion on every player, keyed onto ESPN ids. Allowed to fail on
      # its own: without it the app blends nothing and says "ESPN only".
      - name: Build blended projections
        continue-on-error: true
        run: node scripts/projections.mjs

      # Weekly packs and superlatives for the most recently completed week.
      # Publishes nothing until every game in a week is final, which lands it
      # on Tuesday morning. Also allowed to fail on its own.
      - name: Build weekly packs
        continue-on-error: true
        run: node scripts/weekly.mjs

      # Warning only, on purpose. A red test should be visible, but it must not
      # block the nightly data. Check the Actions tab if this step goes yellow.
      - name: Run tests
        continue-on-error: true
        run: |
          node test/managers.test.mjs
          node test/projections.test.mjs
          node test/pwa.test.mjs
          node test/build.test.mjs
          node test/weekly.test.mjs
          node test/phases.test.mjs
          node test/h2h.test.mjs
          node test/binder.test.mjs
          node test/gate.test.mjs

      - name: Commit if anything changed
        run: |
          git config user.name "bromigos-bot"
          git config user.email "actions@github.com"
          git add data/league.json
          if [ -f data/h2h.json ]; then
            git add data/h2h.json
          fi
          if [ -f data/weekly.json ]; then
            git add data/weekly.json
          fi
          if [ -f data/projections.json ]; then
            git add data/projections.json
          fi
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update league data $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
